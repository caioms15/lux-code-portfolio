<!--
  LOGO ANIMADA (master editável) — Victor Hugo Redação

  Este arquivo é a fonte da geometria usada pela animação de abertura do site.
  Edite aqui (Inkscape, Illustrator, ou como texto) e depois rode:

      node landing-page/dev/sync-logo.mjs

  para aplicar as mudanças em landing-page/js/splash.js.

  Camada "referencia" = logo oficial a 35% de opacidade, só para guiar o ajuste
  (o sync ignora essa camada; pode ocultar/apagar à vontade).

  IMPORTANTE: não renomeie os id= dos elementos — o sync usa eles para mapear.
-->
